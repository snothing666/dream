<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Scene Creator - Quest 2 Pro</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://www.gstatic.com/draco/versioned/decoders/1.5.6/draco_decoder.js"></script>
    
    <style>
      #ui-overlay {
        position: absolute; top: 20px; left: 20px; z-index: 1000;
        background: rgba(0,0,0,0.8); color: white; padding: 15px;
        border-radius: 8px; font-family: sans-serif; display: none;
      }
      .menu-btn { display: block; width: 100%; margin: 5px 0; padding: 10px; background: #444; color: white; border: none; cursor: pointer; }
    </style>
  </head>

  <body>
    <!-- UI MENU (PC Only) -->
    <div id="ui-overlay">
      <h3>NPC Settings</h3>
      <button class="menu-btn" onclick="speakText(currentDialogue)">Test Voice</button>
      <button class="menu-btn" onclick="closeMenu()">Close</button>
    </div>

    <a-scene 
      gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;"
      loading-screen="enabled: false"
      renderer="antialias: true; colorManagement: true;">

      <a-assets timeout="120000">
        <a-asset-item id="room-model" src="https://snothing666.github.io/dream/scene.glb"></a-asset-item>
        <a-asset-item id="npc-model" src="https://snothing666.github.io/dream/npc.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#87CEEB"></a-sky>

      <!-- THE ROOM -->
      <a-entity id="room" gltf-model="#room-model" position="0 0 0" scale="1 1 1"></a-entity>

      <!-- THE PLACEMENT FLOOR -->
      <a-plane id="floor" class="clickable" rotation="-90 0 0" width="200" height="200" visible="false"></a-plane>

      <!-- THE NPC -->
      <a-entity id="npc" class="clickable" gltf-model="#npc-model" npc-manager>
          <a-sphere id="bulb" class="clickable" position="0 2.5 0" radius="0.15" color="yellow"></a-sphere>
      </a-entity>

      <a-light type="ambient" intensity="0.9"></a-light>
      <a-light type="directional" position="1 2 1"></a-light>

      <!-- PLAYER RIG (Supports Thumbstick Walking + Controllers) -->
      <a-entity id="rig" movement-controls="fly: false; speed: 0.2" position="0 0 5">
        <a-entity camera look-controls wasd-controls position="0 1.6 0">
            <!-- Desktop Mouse Cursor -->
            <a-cursor id="mouse-cursor" raycaster="objects: .clickable" cursor="rayOrigin: mouse"></a-cursor>
        </a-entity>

        <!-- Left Controller (Shows model + Thumbstick Move) -->
        <a-entity oculus-touch-controls="hand: left"></a-entity>

        <!-- Right Controller (Shows model + Laser Pointer for clicking) -->
        <a-entity oculus-touch-controls="hand: right" 
                  laser-controls="hand: right" 
                  raycaster="objects: .clickable; far: 20; interval: 100">
        </a-entity>
      </a-entity>

    </a-scene>

    <script>
      let currentDialogue = "Welcome to my bar! How can I help you?";

      AFRAME.registerComponent('npc-manager', {
        init: function () {
          this.isDragging = false;
          
          // Load Saved Position
          const saved = localStorage.getItem('npc_pos');
          if (saved) this.el.setAttribute('position', JSON.parse(saved));

          this.el.addEventListener('click', (evt) => {
            // If clicking lightbulb, show menu (PC) or talk (VR)
            if (evt.detail.intersectedEl && evt.detail.intersectedEl.id === 'bulb') {
                document.getElementById('ui-overlay').style.display = 'block';
                speakText(currentDialogue);
                return;
            }

            // Toggle Dragging
            this.isDragging = !this.isDragging;
            if (this.isDragging) {
              speakText("Moving waitress.");
              this.el.setAttribute('scale', '1.2 1.2 1.2');
            } else {
              speakText("Position saved.");
              this.el.setAttribute('scale', '1 1 1');
              localStorage.setItem('npc_pos', JSON.stringify(this.el.getAttribute('position')));
            }
          });
        },

        tick: function () {
          if (!this.isDragging) return;

          // Find the active raycaster (could be the mouse OR the Quest controller)
          const cursors = document.querySelectorAll('[raycaster]');
          let intersection = null;

          cursors.forEach(c => {
            const check = c.components.raycaster.getIntersection(document.querySelector('#floor'));
            if (check) intersection = check;
          });

          if (intersection) {
            this.el.setAttribute('position', { x: intersection.point.x, y: 0, z: intersection.point.z });
          }
        }
      });

      function speakText(text) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      }

      function closeMenu() { document.getElementById('ui-overlay').style.display = 'none'; }
    </script>
  </body>
</html>
