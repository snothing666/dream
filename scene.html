<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Scene Creator - Fixed</title>
    <!-- 1. CORE LIBRARIES -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <!-- 2. DRACO DECODER (For compressed models) -->
    <script src="https://www.gstatic.com/draco/versioned/decoders/1.5.6/draco_decoder.js"></script>

    <style>
      /* UI DESIGN */
      #ui-overlay {
        position: absolute; top: 20px; left: 20px; z-index: 1000;
        background: rgba(0,0,0,0.8); color: white; padding: 15px;
        border-radius: 8px; font-family: sans-serif; display: none;
      }
      .menu-btn { 
        display: block; width: 100%; margin: 5px 0; padding: 10px; 
        background: #444; color: white; border: none; cursor: pointer; border-radius: 4px;
      }
      .menu-btn:hover { background: #ffcc00; color: black; }
      #editor-modal {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: white; color: black; padding: 25px; border-radius: 10px;
        z-index: 2000; display: none; box-shadow: 0 0 30px rgba(0,0,0,0.5);
      }
      textarea { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
    </style>
  </head>

  <body>
    <!-- CONTEXT MENU UI -->
    <div id="ui-overlay">
      <h3 id="menu-title">NPC Options</h3>
      <button class="menu-btn" onclick="openEditor()">Edit Dialogue</button>
      <button class="menu-btn" onclick="closeMenu()">Close Menu</button>
    </div>

    <!-- DIALOGUE EDITOR -->
    <div id="editor-modal">
      <h3>Waitress Dialogue</h3>
      <p>What should she say when right-clicked?</p>
      <textarea id="dialogue-input" rows="4"></textarea><br>
      <button class="menu-btn" style="background: green" onclick="saveDialogue()">Save Dialogue</button>
      <button class="menu-btn" onclick="document.getElementById('editor-modal').style.display='none'">Cancel</button>
    </div>

    <!-- 3D SCENE -->
    <a-scene 
      loading-screen="enabled: false"
      gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;"
      cursor="rayOrigin: mouse" 
      raycaster="objects: .clickable">

      <a-assets>
        <a-asset-item id="waitress-model" src="npc.glb"></a-asset-item>
        <a-asset-item id="room-model" src="scene.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#87CEEB"></a-sky>

      <!-- THE ROOM: Scale set to 10 to fix the "small" issue -->
      <a-entity id="room" gltf-model="#room-model" position="0 0 0" scale="10 10 10"></a-entity>

      <!-- THE FLOOR: Invisible target for movement -->
      <a-plane id="placement-floor" class="clickable" rotation="-90 0 0" width="200" height="200" visible="false"></a-plane>

      <!-- THE NPC -->
      <a-entity id="npc" class="clickable" gltf-model="#waitress-model" npc-logic>
          <!-- EDIT LIGHTBULB -->
          <a-sphere id="bulb" class="clickable" 
                    position="0 2.4 0" radius="0.15" color="yellow"
                    animation="property: position; to: 0 2.6 0; dir: alternate; dur: 1000; loop: true"
                    material="emissive: #ffff00; emissiveIntensity: 0.5">
          </a-sphere>
      </a-entity>

      <a-light type="ambient" intensity="0.9"></a-light>
      <a-light type="directional" position="1 2 1" intensity="0.6"></a-light>

      <!-- PLAYER -->
      <a-entity id="rig" position="0 1.6 5">
        <a-entity camera look-controls wasd-controls></a-entity>
      </a-entity>

    </a-scene>

    <script>
      let currentDialogue = "Welcome to the bar!";
      let isMovingNPC = false;

      // --- NPC LOGIC COMPONENT ---
      AFRAME.registerComponent('npc-logic', {
        init: function () {
          // 1. Load Saved Data
          const savedPos = localStorage.getItem('npc_pos');
          const savedText = localStorage.getItem('npc_text');
          if (savedPos) this.el.setAttribute('position', JSON.parse(savedPos));
          if (savedText) currentDialogue = savedText;

          // 2. Click NPC -> Toggle Movement
          this.el.addEventListener('click', (e) => {
            if (e.target.id === 'bulb') return; 
            
            isMovingNPC = !isMovingNPC;
            if (isMovingNPC) {
              speakText("Waitress picked up. Click the floor to place her.");
              this.el.setAttribute('scale', '1.2 1.2 1.2');
              this.el.classList.remove('clickable'); 
            }
          });

          // 3. Right Click -> Talk
          window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            let dist = document.querySelector('#rig').object3D.position.distanceTo(this.el.object3D.position);
            if (dist < 5) speakText(currentDialogue);
          });
        }
      });

      // --- FLOOR CLICK LOGIC (For Placing) ---
      document.querySelector('a-scene').addEventListener('click', function(evt) {
        if (!isMovingNPC) return;
        
        let target = evt.detail.intersectedEl;
        if (target && target.id === 'placement-floor') {
          let p = evt.detail.intersection.point;
          let npc = document.querySelector('#npc');
          
          npc.setAttribute('position', {x: p.x, y: 0, z: p.z});
          npc.setAttribute('scale', '1 1 1');
          npc.classList.add('clickable');
          isMovingNPC = false;
          
          localStorage.setItem('npc_pos', JSON.stringify(npc.getAttribute('position')));
          speakText("Waitress placed and saved.");
        }
      });

      // --- UI CONTROLS ---
      document.querySelector('#bulb').addEventListener('click', () => {
        document.getElementById('ui-overlay').style.display = 'block';
      });

      function openEditor() {
        document.getElementById('ui-overlay').style.display = 'none';
        document.getElementById('editor-modal').style.display = 'block';
        document.getElementById('dialogue-input').value = currentDialogue;
      }

      function saveDialogue() {
        currentDialogue = document.getElementById('dialogue-input').value;
        localStorage.setItem('npc_text', currentDialogue);
        document.getElementById('editor-modal').style.display = 'none';
        speakText("Dialogue updated.");
      }

      function closeMenu() {
        document.getElementById('ui-overlay').style.display = 'none';
      }

      function speakText(message) {
        window.speechSynthesis.cancel();
        let utter = new SpeechSynthesisUtterance(message);
        utter.pitch = 1.3;
        window.speechSynthesis.speak(utter);
      }
    </script>
  </body>
</html>
