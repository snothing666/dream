<!DOCTYPE html>
<html>
  <head>
    <title>Architect OS: Master Alpha</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>

    <script>
      // --- ARCHITECT OS ENGINE ---
      window.ArchitectOS = {
        speak: function(text, pitch = 1.0) {
          if ('speechSynthesis' in window) {
            const utter = new SpeechSynthesisUtterance(text);
            utter.pitch = pitch;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utter);
          }
          document.querySelector('#hud-text').setAttribute('value', text);
        }
      };

      // Handle Tablet visibility
      AFRAME.registerComponent('wrist-os', {
        init: function () { 
          // Default hidden for VR, but we can force it for PC
          this.el.setAttribute('visible', false); 
        },
        tick: function () {
          const rot = this.el.object3D.rotation;
          // Only show if palm is facing face (VR only)
          if (!this.el.hasAttribute('debug-on')) {
            this.el.setAttribute('visible', Math.abs(rot.z) > 1.2);
          }
        }
      });

      // Desktop Debug: Press 'M' to see the tablet on your monitor
      window.addEventListener('keydown', (e) => {
        if (e.key === 'm') {
          const tablet = document.querySelector('#tablet-container');
          const isVisible = tablet.getAttribute('visible');
          tablet.setAttribute('visible', !isVisible);
          tablet.setAttribute('debug-on', ''); // Disable wrist-flip check
          tablet.setAttribute('position', '0 0 -0.5'); 
          tablet.setAttribute('rotation', '0 0 0');
        }
      });
    </script>
  </head>

  <body>
    <!-- Main Scene -->
    <a-scene shadow="type: pcfsoft" renderer="colorManagement: true;">
      
      <a-assets>
        <img id="tablet-ui" src="https://i.imgur.com/8AD6D1O.png" crossorigin="anonymous">
        <a-mixin id="btn" geometry="primitive: plane; width: 0.28; height: 0.07" material="color: #111" text="align: center; width: 0.5; color: #0FF"></a-mixin>
      </a-assets>

      <!-- THE LABORATORY (Fixed Lighting & White Room) -->
      <a-sky color="#ffffff"></a-sky>
      <a-entity environment="preset: contact; grid: cross; gridColor: #666; lighting: none; skyType: color; skyColor: #ffffff"></a-entity>

      <!-- Master Lights -->
      <a-entity light="type: ambient; intensity: 0.7"></a-entity>
      <a-entity light="type: directional; intensity: 0.8; castShadow: true" position="1 4 2"></a-entity>

      <!-- PLAYER RIG -->
      <a-entity id="rig" movement-controls="speed: 0.15">
        <a-entity id="camera" camera position="0 1.6 0" look-controls>
          <!-- HUD Text (Moved slightly higher) -->
          <a-text id="hud-text" value="ARCHITECT CONNECTED" position="0 -0.3 -1" align="center" width="1.2" color="cyan" font="monoid"></a-text>
        </a-entity>

        <!-- LEFT HAND (Tablet) -->
        <a-entity id="leftHand" oculus-touch-controls="hand: left">
           <a-entity id="tablet-container" wrist-os position="0.1 0.1 0.1" rotation="-90 0 0">
              <a-plane width="0.32" height="0.48" material="src: #tablet-ui; color: #000">
                <a-text value="ARCHITECT OS v1.5" position="0 0.2 0.01" align="center" width="0.6" color="cyan"></a-text>
                
                <a-entity position="0 0.05 0.01">
                   <a-entity mixin="btn" position="0 0 0" text="value: INITIALIZE UNIT" class="interactable"
                             onclick="window.ArchitectOS.speak('Unit Initialized. Awaiting Loop Command.', 1.0)"></a-entity>
                   <a-entity mixin="btn" position="0 -0.1 0" text="value: APPLY BEAUTY" class="interactable"
                             onclick="window.ArchitectOS.speak('The world is a gift.', 1.2)"></a-entity>
                   <a-entity mixin="btn" position="0 -0.2 0" text="value: APPLY STRENGTH" class="interactable"
                             onclick="window.ArchitectOS.speak('I will win this game.', 0.6)"></a-entity>
                </a-entity>
              </a-plane>
           </a-entity>
        </a-entity>

        <!-- RIGHT HAND (Interaction) -->
        <a-entity id="rightHand" oculus-touch-controls="hand: right"
                  raycaster="objects: .interactable; showLine: true" line="color: cyan"></a-entity>
      </a-entity>

      <!-- THE TARGET HOST -->
      <a-entity id="host-platform" position="0 0 -3">
          <a-cylinder radius="0.25" height="1.6" position="0 0.8 0" color="#222" metalness="0.6"></a-cylinder>
          <a-text value="UNIT_01" position="0 1.8 0" align="center" width="3" color="#333"></a-text>
          <!-- Platform Base -->
          <a-cylinder radius="1" height="0.1" color="#eee"></a-cylinder>
      </a-entity>

    </a-scene>
  </body>
</html>
