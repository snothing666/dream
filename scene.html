<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Scene - Asset Aligned</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
      #ui-overlay {
        position: absolute; top: 20px; left: 20px; z-index: 1000;
        background: rgba(0,0,0,0.8); color: white; padding: 15px;
        border-radius: 8px; font-family: sans-serif; display: none;
      }
    </style>
  </head>

  <body>
    <div id="ui-overlay">
      <h3 id="menu-title">NPC Dialogue</h3>
      <p id="menu-text"></p>
      <button onclick="document.getElementById('ui-overlay').style.display='none'">Close</button>
    </div>

    <a-scene 
      gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;"
      renderer="antialias: true; colorManagement: true;">

      <a-assets>
        <a-asset-item id="room-model" src="https://snothing666.github.io/dream/scene.glb"></a-asset-item>
        <a-asset-item id="npc-model" src="https://snothing666.github.io/dream/npc.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#87CEEB"></a-sky>

      <!-- THE ROOM: Kept at your specific aligned coordinates -->
      <a-entity id="room" gltf-model="#room-model" position="94 0 -16"></a-entity>

      <!-- THE PLACEMENT FLOOR: Adjusted to match your room's location so dragging works -->
      <a-plane id="floor" class="clickable" position="94 0.01 -16" rotation="-90 0 0" width="200" height="200" visible="false"></a-plane>

      <!-- THE NPC -->
      <a-entity id="npc" class="clickable" gltf-model="#npc-model" npc-manager>
          <a-sphere id="bulb" class="clickable" position="0 2.5 0" radius="0.15" color="yellow"></a-sphere>
          <!-- 3D Text for VR visibility -->
          <a-entity id="npc-label" text="value: NPC; align: center; width: 3" position="0 3 0"></a-entity>
      </a-entity>

      <a-light type="ambient" intensity="0.9"></a-light>
      <a-light type="directional" position="1 2 1"></a-light>

      <!-- PLAYER RIG: Starting near your room's coordinates (94, -16) -->
      <a-entity id="rig" movement-controls="fly: false; speed: 0.2" position="94 0 -10">
        <a-entity camera look-controls wasd-controls position="0 1.6 0">
            <a-cursor id="mouse-cursor" raycaster="objects: .clickable" cursor="rayOrigin: mouse"></a-cursor>
        </a-entity>

        <a-entity oculus-touch-controls="hand: left"></a-entity>
        <a-entity oculus-touch-controls="hand: right" laser-controls="hand: right" raycaster="objects: .clickable; far: 30"></a-entity>
      </a-entity>

    </a-scene>

    <script>
      let currentDialogue = "Welcome to my bar! How can I help you?";

      AFRAME.registerComponent('npc-manager', {
        init: function () {
          this.isDragging = false;
          
          // Apply saved position if it exists
          const saved = localStorage.getItem('npc_pos');
          if (saved) {
              this.el.setAttribute('position', JSON.parse(saved));
          } else {
              // Default starting position relative to your room
              this.el.setAttribute('position', {x: 94, y: 0, z: -16});
          }

          this.el.addEventListener('click', (evt) => {
            if (evt.detail.intersectedEl && evt.detail.intersectedEl.id === 'bulb') {
                // Show PC UI
                document.getElementById('ui-overlay').style.display = 'block';
                document.getElementById('menu-text').innerText = currentDialogue;
                speakText(currentDialogue);
                return;
            }

            this.isDragging = !this.isDragging;
            if (this.isDragging) {
              speakText("Moving");
              this.el.setAttribute('scale', '1.2 1.2 1.2');
            } else {
              speakText("Saved");
              this.el.setAttribute('scale', '1 1 1');
              localStorage.setItem('npc_pos', JSON.stringify(this.el.getAttribute('position')));
            }
          });
        },

        tick: function () {
          if (!this.isDragging) return;

          const cursors = document.querySelectorAll('[raycaster]');
          let intersection = null;

          cursors.forEach(c => {
            const intersects = c.components.raycaster.intersections;
            // Specifically look for the intersection with our floor plane
            const hit = intersects.find(i => i.object.el.id === 'floor');
            if (hit) intersection = hit;
          });

          if (intersection) {
            // Update NPC position to the floor hit point
            this.el.setAttribute('position', { x: intersection.point.x, y: 0, z: intersection.point.z });
          }
        }
      });

      function speakText(text) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      }
    </script>
  </body>
</html>
