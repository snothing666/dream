<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Scene Creator - Absolute Fix</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <!-- DRACO DECODER -->
    <script src="https://www.gstatic.com/draco/versioned/decoders/1.5.6/draco_decoder.js"></script>

    <style>
      #ui-overlay {
        position: absolute; top: 20px; left: 20px; z-index: 1000;
        background: rgba(0,0,0,0.85); color: white; padding: 20px;
        border-radius: 10px; font-family: sans-serif; display: none;
      }
      .menu-btn { 
        display: block; width: 100%; margin: 8px 0; padding: 12px; 
        background: #444; color: white; border: none; cursor: pointer; border-radius: 5px;
      }
      .menu-btn:hover { background: #ffcc00; color: black; }
    </style>
  </head>

  <body>
    <!-- UI MENU -->
    <div id="ui-overlay">
      <h3>NPC Options</h3>
      <button class="menu-btn" onclick="openEditor()">Edit Dialogue</button>
      <button class="menu-btn" onclick="closeMenu()">Close</button>
    </div>

    <!-- 3D SCENE -->
    <a-scene 
      loading-screen="enabled: false"
      gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;"
      cursor="rayOrigin: mouse" 
      raycaster="objects: .clickable">

      <a-assets timeout="120000"> <!-- Wait 2 minutes for the 37MB file -->
        <!-- WE ARE USING ABSOLUTE URLS NOW TO STOP THE 404 ERRORS -->
        <a-asset-item id="room-model" src="https://snothing666.github.io/dream/scene.glb"></a-asset-item>
        <a-asset-item id="waitress-model" src="https://snothing666.github.io/dream/npc.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#87CEEB"></a-sky>

      <!-- ROOM: Set to scale 1. If it's too small, we will use the Inspector to find the real size -->
      <a-entity id="room" 
                gltf-model="#room-model" 
                position="0 0 0" 
                scale="1 1 1">
      </a-entity>

      <!-- NPC -->
      <a-entity id="npc" class="clickable" 
                gltf-model="#waitress-model" 
                position="0 0 -5"
                npc-logic>
          <a-sphere id="bulb" class="clickable" position="0 2.5 0" radius="0.15" color="yellow"></a-sphere>
      </a-entity>

      <a-light type="ambient" intensity="1"></a-light>
      <a-light type="directional" position="1 2 1"></a-light>

      <a-entity id="rig" position="0 1.6 5">
        <a-entity camera look-controls wasd-controls></a-entity>
      </a-entity>
    </a-scene>

    <script>
      // Diagnostic: Check if the file is actually loading
      document.querySelector('#room-model').addEventListener('model-loaded', () => {
        console.log("SUCCESS: Room model loaded!");
      });
      document.querySelector('#room-model').addEventListener('model-error', (e) => {
        console.error("ERROR: Room model failed to load. Check filename casing.");
      });

      // Simple NPC Logic for Dialogue
      AFRAME.registerComponent('npc-logic', {
        init: function () {
          this.el.addEventListener('click', (e) => {
            if (e.target.id === 'bulb') {
              document.getElementById('ui-overlay').style.display = 'block';
            } else {
              window.speechSynthesis.speak(new SpeechSynthesisUtterance("Welcome!"));
            }
          });
        }
      });

      function closeMenu() { document.getElementById('ui-overlay').style.display = 'none'; }
    </script>
  </body>
</html>
